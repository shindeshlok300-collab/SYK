<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IF SYK Rubric – Copilot Assistant</title>

  <!-- ✅ REQUIRED LIBRARIES (LOCKED & CORRECT) -->
  <script src="https://unpkg.com/docx@8.5.0/build/index src=".com/file-saver@2.0.5/dist/FileSaver.min.js

  <style>
    body {
      font-family: Calibri, Arial, sans-serif;
      background: #f7f7f7;
      margin: 20px;
      color: #222;
    }

    h1 {
      color: #003366;
    }

    h2 {
      color: #003366;
      border-bottom: 2px solid #003366;
      padding-bottom: 4px;
      margin-top: 30px;
    }

    section {
      background: #ffffff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 6px;
      box-shadow: 0 0 4px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 8px;
      font-family: inherit;
      font-size: 14px;
    }

    button {
      background: #003366;
      color: #ffffff;
      padding: 12px 18px;
      border: none;
      font-size: 15px;
      cursor: pointer;
      border-radius: 4px;
      margin-top: 12px;
    }

    button:hover {
      background: #00509e;
    }
  </style>
</head>

<body>

<h1>Industry Foundations – Show You Know</h1>
<p>Copilot Rubric Evaluation Assistant</p>

<section>
  <h2>Step 1 – Generate Copilot Prompt</h2>
  <button onclick="copyPrompt()">Generate & Copy Copilot Prompt</button>
</section>

<section>
  <h2>Step 2 – Paste Copilot Output</h2>
  <textarea id="copilotOutput" placeholder="Paste the entire Copilot response here..."></textarea>
  <button onclick="downloadRubric()">Download Rubric (.docx)</button>
</section>

<script>
/* ---------- COPILOT PROMPT ---------- */
function copyPrompt() {
  const prompt = `
You are a rubric evaluation assistant.

You must output ALL FIVE sections using these exact headers:

Professionalism
Investment Cycles
Frameworks (IC)
Comprehension of Segments
PBV

Rules:
- 40–50 words per section
- Professional, affirmative evaluator tone
- Suggestions framed constructively
- Do NOT invent information
- End every section with: Score: X / 4
  `.trim();

  navigator.clipboard.writeText(prompt);
  alert("✅ Copilot prompt copied");
}

/* ---------- PARSE COPILOT OUTPUT ---------- */
function parseSections(text) {
  const headers = [
    "Professionalism",
    "Investment Cycles",
    "Frameworks",
    "Comprehension of Segments",
    "PBV"
  ];

  const sections = {};
  let current = null;

  text.split("\n").forEach(line => {
    const trimmed = line.trim();
    const header = headers.find(h => trimmed.startsWith(h));

    if (header) {
      current = header;
      sections[current] = [];
    } else if (current) {
      sections[current].push(trimmed);
    }
  });

  if (Object.keys(sections).length === 0) {
    throw "No rubric sections detected. Check Copilot formatting.";
  }

  return sections;
}

/* ---------- DOCX EXPORT ---------- */
function downloadRubric() {
  try {
    const raw = document.getElementById("copilotOutput").value;
    const sections = parseSections(raw);

    const paragraphs = [
      new docx.Paragraph({
        text: "Industry Foundations – Show You Know Rubric",
        heading: docx.HeadingLevel.HEADING_1
      })
    ];

    for (const [title, lines] of Object.entries(sections)) {
      paragraphs.push(
        new docx.Paragraph({
          text: title,
          heading: docx.HeadingLevel.HEADING_2
        }),
        new docx.Paragraph(lines.join(" "))
      );
    }

    const doc = new docx.Document({
      sections: [{ children: paragraphs }]
    });

    docx.Packer.toBlob(doc).then(blob => {
      saveAs(blob, "SYK_Rubric.docx");
    });

  } catch (err) {
    alert(err);
  }
}
</script>

</body>
</html>
``
